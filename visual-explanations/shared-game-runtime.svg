<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Shared game runtime architecture</title>
  <desc id="description">The registry and router provide metadata and a mount context to one shared game runtime. Each game supplies pure parsing, generation, trace, stage, and challenge hooks. Explore and Challenge both consume the same immutable trace.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#35e8df"/>
    </marker>
    <style>
      .bg{fill:#11182b}.panel{fill:#080b16;stroke:#f5f1d0;stroke-width:4}.shared{fill:#1c2942;stroke:#35e8df;stroke-width:4}.game{fill:#1c2942;stroke:#ffd34e;stroke-width:4}.trace{fill:#1c2942;stroke:#65e572;stroke-width:4}.title{fill:#f5f1d0;font:700 20px monospace}.text{fill:#a8b5c7;font:16px monospace}.small{fill:#f5f1d0;font:14px monospace}.line{fill:none;stroke:#35e8df;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="40" y="48">ALGO ARCADE // SHARED GAME RUNTIME</text>

  <rect class="panel" x="40" y="88" width="260" height="120"/>
  <text class="title" x="64" y="124">REGISTRY + ROUTER</text>
  <text class="text" x="64" y="156">metadata, lazy loader</text>
  <text class="text" x="64" y="182">game number, mount context</text>

  <rect class="shared" x="420" y="72" width="340" height="152"/>
  <text class="title" x="444" y="112">SHARED mountGameUi</text>
  <text class="text" x="444" y="146">input + validation lifecycle</text>
  <text class="text" x="444" y="174">playback + focus + cleanup</text>
  <text class="text" x="444" y="202">challenge score + retry</text>

  <rect class="shared" x="880" y="88" width="280" height="120"/>
  <text class="title" x="904" y="124">SHARED TEMPLATE</text>
  <text class="text" x="904" y="156">shell, controls, panels</text>
  <text class="text" x="904" y="182">responsive NES-style CSS</text>

  <path class="line" d="M300 148 H410"/>
  <path class="line" d="M760 148 H870"/>

  <rect class="game" x="40" y="316" width="310" height="244"/>
  <text class="title" x="64" y="352">GAME CONFIGURATION</text>
  <text class="text" x="64" y="386">branded parser + validator</text>
  <text class="text" x="64" y="418">procedural example generator</text>
  <text class="text" x="64" y="450">pure trace generator</text>
  <text class="text" x="64" y="482">stage + pseudocode hooks</text>
  <text class="text" x="64" y="514">challenge decision hooks</text>
  <text class="small" x="64" y="544">Owned by src/games/&lt;slug&gt;/</text>

  <rect class="trace" x="450" y="340" width="300" height="172"/>
  <text class="title" x="474" y="378">IMMUTABLE TRACE</text>
  <text class="text" x="474" y="412">atomic snapshots</text>
  <text class="text" x="474" y="442">stable pseudocode IDs</text>
  <text class="text" x="474" y="472">state + explanation + counts</text>

  <rect class="panel" x="870" y="300" width="290" height="112"/>
  <text class="title" x="894" y="338">EXPLORE MODE</text>
  <text class="text" x="894" y="372">rewindable trace playback</text>

  <rect class="panel" x="870" y="464" width="290" height="112"/>
  <text class="title" x="894" y="502">CHALLENGE MODE</text>
  <text class="text" x="894" y="536">decisions derived from trace</text>

  <path class="line" d="M420 188 C350 240 300 260 260 306"/>
  <path class="line" d="M350 424 H440"/>
  <path class="line" d="M750 404 C810 390 820 358 860 356"/>
  <path class="line" d="M750 454 C810 470 820 514 860 520"/>

  <text class="small" x="40" y="660">ONE HIGH-LEVEL TEMPLATE // GAME-SPECIFIC ALGORITHM STATE // ONE TRACE FEEDS BOTH MODES</text>
</svg>
