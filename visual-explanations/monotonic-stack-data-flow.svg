<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Monotonic stack game data flow</title>
  <desc id="description">Editable input passes through validation into one pure trace generator. Immutable snapshots then drive both Explore mode and Challenge mode before rendering on the shared stage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35e8df" />
    </marker>
    <style>
      .background { fill: #11182b; }
      .panel { fill: #1c2942; stroke: #f5f1d0; stroke-width: 4; }
      .core { fill: #080b16; stroke: #ffd34e; stroke-width: 6; }
      .branch { fill: #1c2942; stroke: #f04f9a; stroke-width: 4; }
      .arrow { fill: none; stroke: #35e8df; stroke-width: 5; marker-end: url(#arrow); }
      .title { fill: #f5f1d0; font: bold 25px monospace; }
      .label { fill: #35e8df; font: bold 16px monospace; }
      .copy { fill: #a8b5c7; font: 15px monospace; }
      .number { fill: #11182b; font: bold 16px monospace; }
      .badge { fill: #ffd34e; }
    </style>
  </defs>
  <rect class="background" width="1200" height="700" />
  <text class="title" x="64" y="64">STACK REACTOR // ONE TRACE, TWO MODES</text>

  <rect class="panel" x="64" y="126" width="210" height="150" />
  <rect class="badge" x="80" y="142" width="32" height="32" />
  <text class="number" x="88" y="165">01</text>
  <text class="label" x="80" y="202">EDIT EXAMPLE</text>
  <text class="copy" x="80" y="230">1-12 integers</text>
  <text class="copy" x="80" y="252">presets or custom</text>

  <path class="arrow" d="M 274 201 H 354" />

  <rect class="panel" x="356" y="126" width="210" height="150" />
  <rect class="badge" x="372" y="142" width="32" height="32" />
  <text class="number" x="380" y="165">02</text>
  <text class="label" x="372" y="202">PARSE + VALIDATE</text>
  <text class="copy" x="372" y="230">syntax, length,</text>
  <text class="copy" x="372" y="252">integer bounds</text>

  <path class="arrow" d="M 566 201 H 646" />

  <rect class="core" x="648" y="110" width="250" height="182" />
  <rect class="badge" x="668" y="130" width="32" height="32" />
  <text class="number" x="676" y="153">03</text>
  <text class="label" x="668" y="195">PURE TRACE ENGINE</text>
  <text class="copy" x="668" y="225">inspect / compare</text>
  <text class="copy" x="668" y="247">resolve / push</text>
  <text class="copy" x="668" y="269">complete</text>

  <path class="arrow" d="M 898 201 H 978" />

  <rect class="panel" x="980" y="126" width="156" height="150" />
  <rect class="badge" x="996" y="142" width="32" height="32" />
  <text class="number" x="1004" y="165">04</text>
  <text class="label" x="996" y="202">SNAPSHOTS</text>
  <text class="copy" x="996" y="230">immutable</text>
  <text class="copy" x="996" y="252">rewindable</text>

  <path class="arrow" d="M 1058 276 V 346 H 772 V 392" />
  <path class="arrow" d="M 1058 346 H 1050 V 392" />

  <rect class="branch" x="648" y="394" width="250" height="154" />
  <text class="label" x="672" y="430">EXPLORE MODE</text>
  <text class="copy" x="672" y="460">timeline + playback</text>
  <text class="copy" x="672" y="484">state + pseudocode</text>
  <text class="copy" x="672" y="508">operation counters</text>

  <rect class="branch" x="922" y="394" width="214" height="154" />
  <text class="label" x="946" y="430">CHALLENGE MODE</text>
  <text class="copy" x="946" y="460">same compare steps</text>
  <text class="copy" x="946" y="484">outcomes hidden</text>
  <text class="copy" x="946" y="508">retry with reason</text>

  <path class="arrow" d="M 773 548 V 608 H 590" />
  <path class="arrow" d="M 1029 548 V 608 H 898" />

  <rect class="panel" x="356" y="574" width="542" height="86" />
  <text class="label" x="380" y="610">SHARED NES-INSPIRED STAGE</text>
  <text class="copy" x="380" y="638">input deck + stack reactor + answer bay + accessible controls</text>
</svg>
